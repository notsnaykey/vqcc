[project]
name = "vqcc"
version = "0.1.0"
description = "Tooling for the Google Quantum AI 'Verifiable Quantum Circuit Compilation' Kaggle competition."
requires-python = ">=3.11"
dependencies = [
    "kickmix>=1.0.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
kaggle = ["kaggle>=1.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
